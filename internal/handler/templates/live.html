<!DOCTYPE html>
<html lang="en" data-theme="{{.Theme}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>{{if .BusinessName}}{{.BusinessName}} — {{end}}Live</title>
{{if .DemoMode}}<meta name="robots" content="noindex,nofollow">{{end}}
<style>
/* Self-contained (no /booking.css): this page is meant to sit inside an <iframe> on the
   operator's site, so it carries only what it needs and respects ?theme=light|dark. Same
   type scale, radii and greys as book.html so the two read as one family. */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f3f4f6; --card: #fff; --fg: #111827; --muted: #6b7280; --line: #e5e7eb;
  --accent: #111827; --accent-fg: #fff; --live: #dc2626; --live-bg: #fef2f2;
  --off: #9ca3af; --off-bg: #f3f4f6;
}
html[data-theme="dark"] {
  --bg: #0b0f19; --card: #111827; --fg: #f9fafb; --muted: #9ca3af; --line: #1f2937;
  --accent: #f9fafb; --accent-fg: #111827; --live: #f87171; --live-bg: #450a0a;
  --off: #6b7280; --off-bg: #1f2937;
}
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  padding: 1.5rem 1rem; gap: 1rem;
}
.brand { display: flex; align-items: center; gap: .5rem; font-size: .8125rem; color: var(--muted); }
.brand img { height: 24px; width: auto; }
.card {
  background: var(--card); border-radius: 16px; width: 100%; max-width: 560px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 12px 40px rgba(0,0,0,.1);
  padding: 1.75rem 1.5rem; display: flex; flex-direction: column; gap: 1rem;
}
.badge {
  display: inline-flex; align-items: center; gap: .4rem; font-size: .6875rem; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase; padding: .25rem .6rem; border-radius: 999px;
  width: fit-content;
}
.badge.live { background: var(--live-bg); color: var(--live); }
.badge.live::before {
  content: ''; width: .5rem; height: .5rem; border-radius: 50%; background: var(--live);
  animation: pulse 1.4s ease-in-out infinite;
}
.badge.off { background: var(--off-bg); color: var(--off); }
.badge.off::before { content: ''; width: .5rem; height: .5rem; border-radius: 50%; background: var(--off); }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
@media (prefers-reduced-motion: reduce) { .badge.live::before { animation: none; } }
h1 { font-size: 1.25rem; font-weight: 700; line-height: 1.3; }
.host { font-size: .8125rem; color: var(--muted); }
.desc { font-size: .875rem; color: var(--muted); line-height: 1.6; white-space: pre-line; }
.when { font-size: .9375rem; }
.join {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  background: var(--accent); color: var(--accent-fg); text-decoration: none; font-weight: 600;
  font-size: .9375rem; padding: .75rem 1.25rem; border-radius: 10px; width: fit-content;
}
.join:hover { opacity: .9; }
.session + .session { border-top: 1px solid var(--line); padding-top: 1rem; }
.upcoming { border-top: 1px solid var(--line); padding-top: 1rem; display: flex; flex-direction: column; gap: .6rem; }
.upcoming h2 { font-size: .6875rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.upcoming li { list-style: none; display: flex; justify-content: space-between; gap: 1rem; font-size: .8125rem; }
.upcoming li span:last-child { color: var(--muted); white-space: nowrap; }
.empty { font-size: .875rem; color: var(--muted); }
.hidden { display: none !important; }
.err { font-size: .8125rem; color: var(--live); }
</style>
</head>
<body>
{{if or .LogoURL .BusinessName}}<div class="brand">{{if .LogoURL}}<img src="{{.LogoURL}}" alt="">{{end}}{{if .BusinessName}}<span>{{.BusinessName}}</span>{{end}}</div>{{end}}
<main class="card" id="card" aria-live="polite">
  <p class="empty" id="loading">Checking who’s live…</p>
  <p class="err hidden" id="error">Couldn’t reach the server. Retrying…</p>
  <p class="host hidden" id="stale">Live status may be out of date — we couldn’t reach the server. Retrying…</p>
  <div id="live" class="hidden"></div>
  <div id="offline" class="hidden">
    <span class="badge off">Offline</span>
    <p class="when" id="next-line" style="margin-top:.75rem"></p>
    <p class="host" id="next-host"></p>
    <p class="desc" id="next-desc"></p>
  </div>
  <div id="upcoming" class="upcoming hidden">
    <h2>Also coming up</h2>
    <ul id="upcoming-list"></ul>
  </div>
</main>
<script>
(function () {
  var KIND = {{.Kind}};
  var POLL_MS = 30000;
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  var kindLabel = function (k) { var t = String(k || '').replace(/[_-]+/g, ' ').trim(); return t ? t.charAt(0).toUpperCase() + t.slice(1) : ''; };
  // Viewer-local formatting via Intl: the server sends RFC3339 UTC and never a rendered date.
  var fmtWhen = function (iso) {
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    var tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
    var time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    if (sameDay) return 'Today at ' + time;
    if (d.toDateString() === tomorrow.toDateString()) return 'Tomorrow at ' + time;
    return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) + ' at ' + time;
  };
  var show = function (id, on) { $(id).classList.toggle('hidden', !on); };

  // After STALE_AFTER consecutive failed polls the last good status stays on screen, but
  // the Join button is dropped (the session may have ended) and a notice says the status
  // may be out of date. The next successful poll renders normally again.
  var STALE_AFTER = 3, failures = 0, last = null;

  function render(data, stale) {
    show('loading', false);
    show('error', false);
    show('stale', !!stale);
    var live = data.live || [];
    var liveBox = $('live');
    liveBox.textContent = '';
    if (live.length) {
      live.forEach(function (s) {
        var box = el('div', 'session');
        box.appendChild(el('span', 'badge live', 'Live now'));
        var h = el('h1', null, s.title); h.style.marginTop = '.75rem'; box.appendChild(h);
        if (s.host_name) box.appendChild(el('p', 'host', 'Hosted by ' + s.host_name + ' · ' + kindLabel(s.kind)));
        if (s.description) box.appendChild(el('p', 'desc', s.description));
        if (s.join_url && !stale) {
          var a = el('a', 'join', 'Join now');
          a.href = s.join_url; a.target = '_blank'; a.rel = 'noopener noreferrer';
          a.style.marginTop = '.5rem';
          box.appendChild(a);
        }
        liveBox.appendChild(box);
      });
      show('live', true);
      show('offline', false);
    } else {
      show('live', false);
      var next = data.next;
      $('next-line').textContent = next ? 'Next session: ' + next.title + ' — ' + fmtWhen(next.scheduled_start_at) : 'No session scheduled yet.';
      $('next-host').textContent = next && next.host_name ? 'Hosted by ' + next.host_name + ' · ' + kindLabel(next.kind) : '';
      $('next-desc').textContent = next && next.description ? next.description : '';
      show('offline', true);
    }
    var up = (data.upcoming || []);
    if (live.length && data.next) up = [data.next].concat(up);
    var list = $('upcoming-list');
    list.textContent = '';
    up.forEach(function (s) {
      var li = el('li');
      li.appendChild(el('span', null, s.title));
      li.appendChild(el('span', null, fmtWhen(s.scheduled_start_at)));
      list.appendChild(li);
    });
    show('upcoming', up.length > 0);
  }

  function poll() {
    var url = '/v1/live/status' + (KIND ? '?kind=' + encodeURIComponent(KIND) : '');
    fetch(url, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) { failures = 0; last = data; render(data); })
      .catch(function () {
        if (!last) { show('loading', false); show('error', true); return; }
        failures++;
        if (failures === STALE_AFTER) render(last, true);
      });
  }
  poll();
  setInterval(poll, POLL_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
})();
</script>
</body>
</html>
